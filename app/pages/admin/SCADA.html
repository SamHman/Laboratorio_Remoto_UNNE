<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Remoto</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="SCADA.CSS">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="/images/UNNE_logo.png" alt="UNNE" class="unne-logo">
            
        </div>
        <h1>Laboratorio Remoto</h1>
        <div class="user-controls">
            <div class="user-menu" id="user-menu">
                <button class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
                    <span class="user-info">
                        <span id="header-username" class="username">Cargando...</span>
                    </span>
                    <i class='bx bx-chevron-down user-menu-caret'></i>
                </button>
                <div class="user-menu-dropdown" id="user-menu-dropdown">
                    <button class="user-menu-item" id="logout-icon" title="Cerrar sesión">
                        <i class='bx bx-log-out'></i> Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="chart-container" id="chart-container-main">
            <canvas id="realTimeChart"></canvas>
            <button id="export-icon" class="chart-action-btn export-btn" title="Exportar datos a Excel">
                <i class='bx bx-download'></i>
                <span>Exportar Excel</span>
            </button>
            <button class="chart-action-btn expand-btn" title="Expandir gráfico">
                <i class='bx bx-expand'></i>
            </button>
        </div>
        <section class="data-panel" id="data-panel">
            <!-- Data items will be generated by JavaScript -->
        </section>
        <div class="circuit-placeholder">
            <!-- Reloj Digital -->
            <div class="reloj-marco">
                <div id="reloj-digital">
                    <span id="hora">00</span>
                    <span class="separador">:</span>
                    <span id="minuto">00</span>
                    <span class="separador segundos-separador">:</span>
                    <span id="segundo">00</span>
                </div>
                <div id="localizacion">ARG</div>
            </div>
            <div class="scada-scale-wrapper">
            <div class="scada-container">
                <svg class="connections-layer">
                    <line x1="165" y1="260" x2="290" y2="260"></line>
                    <line x1="150" y1="360" x2="290" y2="360"></line>
                    <line x1="320" y1="250" x2="320" y2="180"></line>
                    <line x1="320" y1="400" x2="320" y2="440"></line>
                    <line x1="350" y1="260" x2="450" y2="260"></line>
                    <line x1="350" y1="360" x2="460" y2="360"></line>
                    <line x1="555" y1="310" x2="625" y2="310"></line>
                    <line x1="655" y1="280" x2="655" y2="180"></line>
                    <line x1="685" y1="310" x2="740" y2="310"></line>
                </svg>

                <img src="images/Paneles.png" alt="Paneles Solares" class="component" id="solar-panels">
                
                <img src="images/Disyuntor.png" alt="Disyuntor Superior" class="component" id="breaker-top">
                <img src="images/Disyuntor.png" alt="Disyuntor Inferior" class="component" id="breaker-bottom">
                <img src="images/Disyuntor.png" alt="Disyuntor Central" class="component" id="breaker-center">
                
                <!-- Relay 1 (Superior) -->
                <div class="device-block" id="block-esp8266-top">
                    <img src="images/Relay_OFF.png" alt="ESP8266 Superior" class="component interactive-esp8266" id="esp8266-top">
                    <div class="device-label">Relay 1</div>
                    <div class="device-status-text" id="status-esp8266-top">OFF</div>
                </div>
                <!-- Relay 2 (Inferior) -->
                <div class="device-block" id="block-esp8266-bottom">
                    <img src="images/Relay_OFF.png" alt="ESP8266 Inferior" class="component interactive-esp8266" id="esp8266-bottom">
                    <div class="device-label">Relay 2</div>
                    <div class="device-status-text" id="status-esp8266-bottom">OFF</div>
                </div>
                <!-- Relay 3 (Derecha) -->
                <div class="device-block" id="block-esp8266-right">
                    <img src="images/Relay_OFF.png" alt="ESP8266 Derecha" class="component interactive-esp8266" id="esp8266-right">
                    <div class="device-label">Relay 3</div>
                    <div class="device-status-text" id="status-esp8266-right">OFF</div>
                </div>
                <!-- Inversor -->
                <div class="device-block" id="block-goodwe-inverter">
                    <img src="images/Inverter_OFF.png" alt="Inversor GoodWe" class="component interactive-inverter" id="goodwe-inverter">
                    <div class="device-label">Inversor</div>
                    <div class="device-status-text" id="status-goodwe-inverter">OFF</div>
                </div>
                
                <img src="images/Alterna.png" alt="AC Salida Derecha" class="component" id="ac-right">
            </div>
            </div>

        </div>

    <!-- Modal para información detallada de dispositivos -->
    <div id="device-modal" class="modal">
        <span class="close-button">&times;</span>
        <div class="modal-content device-modal-content">
            <div class="device-header">
                <h2 id="device-title">Dispositivo</h2>
                <div class="device-status" id="device-status">
                    <span class="status-indicator"></span>
                    <span class="status-text">Conectado</span>
                </div>
            </div>
            
            <div class="device-info-grid">
                <div class="info-section">
                    <h3>Información General</h3>
                    <div id="device-general-info">
                        <!-- Información general del dispositivo -->
                    </div>
                </div>
                
                <div class="info-section">
                    <h3>Datos en Tiempo Real</h3>
                    <div id="device-realtime-data">
                        <!-- Datos en tiempo real -->
                    </div>
                </div>
                
                <div class="info-section">
                    <h3>Historial</h3>
                    <div id="device-history">
                        <!-- Historial de datos -->
                    </div>
                </div>
            </div>
            
            <div class="device-actions">
                <button id="refresh-device-btn" class="action-btn">
                    <i class='bx bx-refresh'></i> Actualizar
                </button>
                <button id="export-device-btn" class="action-btn">
                    <i class='bx bx-export'></i> Exportar Datos
                </button>
            </div>
        </div>
    </div>

    <div id="chart-modal" class="modal">
        <span class="close-button">&times;</span>
        <div class="modal-content">
            <canvas id="modalChart"></canvas>
        </div>
    </div>

    <div id="export-modal" class="modal">
        <span class="close-button">&times;</span>
        <div class="modal-content export-modal-content">
            <h2>Exportar Datos</h2>
            <div class="export-options">
                <label for="start-time">Desde:</label>
                <input type="datetime-local" id="start-time" name="start-time">
                <label for="end-time">Hasta:</label>
                <input type="datetime-local" id="end-time" name="end-time">
            </div>
            <button id="confirm-export-btn">Exportar a .XLS</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <script type="module" src="/SCADA.js"></script>
</body>
</html>
