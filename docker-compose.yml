services:

  mysql:
    image: mysql:8.0
    container_name: labvirtualunne_mysql
    # Hora Argentina (UTC-3, sin horario de verano). Solo afecta a las columnas TIMESTAMP
    # (fecha_importacion, creado_en) y a NOW(): sin esto quedaban 3 h adelantadas. Las
    # DATETIME (fecha_hora) se guardan tal cual y no cambian. Ninguna consulta compara
    # NOW() contra fecha_hora, así que filtros del dashboard y del Excel no se ven afectados.
    command: --default-time-zone=-03:00
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-labvirtual}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:3306:3306" # solo loopback de la VPS, no expuesto a internet - para conectar con un cliente SQL vía túnel SSH
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: labvirtualunne_node
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-labvirtual}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_COOKIE_EXPIRES: ${JWT_COOKIE_EXPIRES}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      INGEST_API_KEY: ${INGEST_API_KEY}
      GOOGLE_SHEETS_KEY_FILE: ${GOOGLE_SHEETS_KEY_FILE:-./credentials/google-sheets-irradiancia.json}
      GOOGLE_SHEETS_IRRADIANCIA_ID: ${GOOGLE_SHEETS_IRRADIANCIA_ID}
      GOOGLE_SHEETS_IRRADIANCIA_GID: ${GOOGLE_SHEETS_IRRADIANCIA_GID:-0}
      IRRADIANCIA_POLL_INTERVAL_MS: ${IRRADIANCIA_POLL_INTERVAL_MS:-60000}
      IRRADIANCIA_SYNC_DIAS: ${IRRADIANCIA_SYNC_DIAS:-2}
    volumes:
      - ./credentials:/app/credentials:ro,z
    expose:
      - "4000"
    ports:
      - "127.0.0.1:8155:4000"
    networks:
      - backend

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: labvirtualunne_php
    restart: unless-stopped
    # Tope duro de RAM. Desde 2026-11-25 la exportación a Excel va por meses y en streaming
    # (app/includes/exportar_excel.php): cada pedido usa decenas de MB (memory_limit 512M)
    # aunque se exporten años. Antes hacía falta 4g porque PhpSpreadsheet armaba todo en memoria.
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./.env:/var/www/html/.env:ro,z
      - php_logs:/var/www/html/logs
    expose:
      - "80"
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: labvirtualunne_nginx
    restart: unless-stopped
    depends_on:
      - node
      - php
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
    expose:
      - "80"
    ports:
      - "127.0.0.1:8154:80"
    # Hay que modificar: el dominio ya es el definitivo (labfv.unne.edu.ar, 2026-11-25), pero la
    # red prueba1_traefik-public y los nombres websecure/letsencrypt son del Traefik de la VPS
    # vieja (Contabo). En la VPS nueva: adaptarlos al Traefik que tenga, o sacar este bloque
    # (labels + red externa) si usa nginx/Caddy en el host. Ver GUIA_DESPLIEGUE_ADMINISTRADOR.
    networks:
      - backend
      - prueba1_traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=prueba1_traefik-public
      - traefik.http.routers.labvirtualunne.rule=Host(`labfv.unne.edu.ar`)
      - traefik.http.routers.labvirtualunne.entrypoints=websecure
      - traefik.http.routers.labvirtualunne.tls.certresolver=letsencrypt
      - traefik.http.routers.labvirtualunne.service=labvirtualunne-nginx-svc
      - traefik.http.services.labvirtualunne-nginx-svc.loadbalancer.server.port=80

volumes:
  mysql_data:
  php_logs:

networks:
  backend:
  # Hay que modificar: red externa del Traefik de Contabo (ver comentario en el servicio nginx).
  prueba1_traefik-public:
    external: true
