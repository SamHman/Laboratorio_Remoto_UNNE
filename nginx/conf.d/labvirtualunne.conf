server {
    listen 80;
    server_name labvirtualunne.linkgestion.com;

    # PHP: mismo prefijo /app/api/ que ya usan los fetch de SCADA.js
    # (evita tocar cada URL hardcodeada en el frontend).
    location /app/api/ {
        proxy_pass http://labvirtualunne_php:80/app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exportaciones a Excel de rangos largos (años) tardan varios minutos
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Todo lo demás (SCADA, login, API de Node, WebSocket de navegador) va a Node.
    location / {
        proxy_pass http://labvirtualunne_node:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
