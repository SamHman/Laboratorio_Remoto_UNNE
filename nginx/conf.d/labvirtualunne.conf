server {
    listen 80;
    # Hay que modificar: dominio de la VPS nueva (pulido).
    server_name labvirtualunne.linkgestion.com;

    # PHP: mismo prefijo /app/api/ que ya usan los fetch de SCADA.js
    # (evita tocar cada URL hardcodeada en el frontend).
    location /app/api/ {
        # Sin sesión no se llega a PHP (2026-11-20): antes de reenviar, nginx consulta
        # a Node (/_auth_sesion, abajo). Node contesta 204 (pasa) o 401 (nginx corta
        # con 401 y PHP nunca se ejecuta). Los PHP no validan nada por su cuenta.
        auth_request /_auth_sesion;
        proxy_pass http://labvirtualunne_php:80/app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exportaciones a Excel de rangos largos (años) tardan varios minutos
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Subrequest interno de auth_request (no accesible desde afuera: "internal").
    # Viaja sin cuerpo pero con los headers originales, incluida la cookie de sesión.
    location = /_auth_sesion {
        internal;
        proxy_pass http://labvirtualunne_node:4000/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Todo lo demás (SCADA, login, API de Node, WebSocket de navegador) va a Node.
    location / {
        proxy_pass http://labvirtualunne_node:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
